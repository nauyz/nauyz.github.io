name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare video for progressive playback
        run: |
          npm install --prefix /tmp/video-tools --no-audit --no-fund @ffmpeg-installer/linux-x64@4.1.0
          export PATH="/tmp/video-tools/node_modules/@ffmpeg-installer/linux-x64:$PATH"
          echo "/tmp/video-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          ffmpeg -hide_banner -loglevel error -i public/media/creator-studio/demo.mp4 -map 0 -c copy -movflags +faststart -max_interleave_delta 1000000 /tmp/studio-faststart.mp4
          mv /tmp/studio-faststart.mp4 public/media/creator-studio/demo.mp4
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
