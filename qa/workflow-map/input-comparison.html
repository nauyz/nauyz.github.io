*{box-sizing:border-box}body{margin:0;background:#06181d;color:#edece3;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1240px;margin:auto;padding:36px 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:25px;font-weight:500;margin:0}a{color:#aab9b7;text-decoration:none;font-size:12px}.samples{display:grid;grid-template-columns:1fr 1fr;gap:22px}article{min-width:0}h2{font-size:16px;font-weight:500;margin:0 0 10px}p{font-size:12px;line-height:1.8;color:#aab9b7;margin:8px 0}svg.scene{width:100%;display:block;background:linear-gradient(135deg,#fdfdfc,#f7f7f5);border-radius:13px;color:#555d4e}svg text{font-family:'Microsoft YaHei',sans-serif}.controls{display:flex;gap:12px;align-items:center;margin-top:24px}button{background:#122b31;border:1px solid #344c50;border-radius:8px;color:#edece3;padding:9px 16px;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:2px solid #9582ff;outline-offset:3px}input{flex:1;accent-color:#b7a1ee;min-width:20px}.source{cursor:pointer}.time{font-size:12px;font-variant-numeric:tabular-nums;color:#aab9b7} @media(max-width:720px){.samples{grid-template-columns:1fr}main{padding:24px 16px}h1{font-size:20px}}
</style><main><header><h1>合成节点 · 输入如何进入</h1><a href="/">返回完整地图 ↗</a></header><div class="samples"><article><h2>① 小图标 · 同步汇入</h2><svg id="icons-scene" class="scene" viewBox="0 0 520 420" role="img" aria-label="四个小图标同时弹出说明、连线并汇入合成节点"></svg><p>四项一起弹出、一起连线汇入、一起消失。</p></article><article><h2>③ 清单 · 逐条提取</h2><svg id="list-scene" class="scene" viewBox="0 0 520 420" role="img" aria-label="清单条目逐个弹起，移入合成节点"></svg><p>输入集中放在一份清单里；当前条目弹起，再移入节点。</p></article></div><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><input id="seek" type="range" min="0" max="14" step=".01" value="0" aria-label="演示进度"><span class="time">0 / 14 s</span></div></main><script type="module" src="input-comparison.js"></script></html>
